#
# RobotFramework_DBus - pyproject.toml
#
# --------------------------------------------------------------------------------------------------------------

[build-system]
requires = ["setuptools==79.0.1", "wheel", "colorama==0.4.6", "pypandoc_binary==1.15", "PythonExtensionsCollection"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-dbus"
version = "0.1.3"
description = "Robot Framework QConnect library extension for dbus testing"
authors = [
   {name = "Nguyen Huynh Tri Cuong", email = "cuong.nguyenhuynhtri@vn.bosch.com"}
]
maintainers = [
   {name = "Nguyen Huynh Tri Cuong", email = "cuong.nguyenhuynhtri@vn.bosch.com"}
]
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
   "robotframework",
   "pycairo; platform_system=='Linux'",
   "PyGObject; platform_system=='Linux'",
   "dasbus; platform_system=='Linux'"
]

[project.urls]
Homepage = "https://github.com/test-fullautomation/robotframework-dbus"

[tool.setuptools]
packages = [
   "RobotFramework_DBus",
   "RobotFramework_DBus.common",
   "RobotFramework_DBus.dbus_agent"
]

[tool.setuptools.package-data]
RobotFramework_DBus = ["*.pdf"]
